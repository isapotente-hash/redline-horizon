<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Redline Horizon</title>
    <meta
      name="description"
      content="Drive the VANTA R1 through an original coastal open world."
    />
    <link rel="icon" href="./favicon.svg" />
    <script type="module" crossorigin src="./assets/index-CMqeyWa3.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/three-k_TTp3Jx.js">
    <link rel="modulepreload" crossorigin href="./assets/physics-CpfVXZ1b.js">
    <link rel="stylesheet" crossorigin href="./assets/index-DrWFeEbA.css">
  </head>
  <body>
    <canvas id="game" aria-label="Redline Horizon 3D driving world"></canvas>
    <style>
      html,body{margin:0;background:#000}
      #startup{position:fixed;inset:0;background:#000;z-index:99999;display:grid;place-items:center;opacity:1;transition:opacity .6s ease;pointer-events:all}
      #startup img{display:block;width:min(660px,80vw);max-height:76vh;object-fit:contain;opacity:0;animation:logo-in 1.8s ease-out forwards;will-change:opacity}
      #startup.ready{opacity:0}
      .startup-progress{position:absolute;top:75%;width:min(320px,70vw);color:#c7ddd7;font:12px system-ui;text-align:center}.startup-progress progress{display:block;width:100%;height:4px;margin:12px 0;accent-color:#8be8ce}.startup-progress span{font-variant-numeric:tabular-nums}
      @keyframes logo-in{from{opacity:0}to{opacity:1}}
      @media(prefers-reduced-motion:reduce){#startup img{animation-duration:.1s}#startup{transition-duration:.1s}}
    </style>
    <div id="startup" role="status" aria-label="Loading Redline Horizon"><img src="./redline-logo.png" alt="Redline Horizon" fetchpriority="high"><div class="startup-progress"><progress id="startup-bar" max="100" value="0" aria-label="Loading progress"></progress><span id="startup-percent">0%</span></div></div>
    <main id="ui" aria-busy="true"></main>
  </body>
</html>
